<!-- ===== Fedipedia — estilo de enciclopédia clássica. Colar em _includes/head-custom.html ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<style>
  :root {
    --papel: #FBF9F4;
    --tinta: #202122;
    --cinza: #6B6B6B;
    --fio: #D8D3C7;
    --link: #2A5DB0;
    --link-visitado: #5A3E8C;
  }

  html, body { background: var(--papel); }

  .markdown-body {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 18px;
    line-height: 1.65;
    color: var(--tinta);
    max-width: 46em;
    margin: 0 auto !important;
    padding: 2.5em 1.5em 3em !important;
  }

  /* ---------- Cabeçalho: "Fedipedia" como nome de obra de referência ---------- */
  .markdown-body > h1:first-child {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-weight: 400;
    font-size: 1.6em;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    text-align: center;
    border: 0;
    border-bottom: 3px double var(--fio);
    padding: 0 0 0.5em;
    margin: 0 0 1.8em;
  }
  .markdown-body > h1:first-child a { color: var(--tinta); text-decoration: none; }

  /* ---------- Títulos de verbete e seções ---------- */
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-weight: 400;
    color: var(--tinta);
    line-height: 1.25;
  }
  .markdown-body h1:not(:first-child) {
    font-size: 2.1em;
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.2em;
    margin: 1.6em 0 0.7em;
  }
  .markdown-body h2 {
    font-size: 1.45em;
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.15em;
    margin: 1.6em 0 0.6em;
  }
  .markdown-body h3 { font-size: 1.15em; font-weight: 700; border: 0; }

  .markdown-body p { margin: 0 0 1em; }

  /* ---------- Links no padrão de enciclopédia ---------- */
  .markdown-body a { color: var(--link); text-decoration: none; }
  .markdown-body a:visited { color: var(--link-visitado); }
  .markdown-body a:hover { text-decoration: underline; text-underline-offset: 0.15em; }

  /* ---------- Página inicial: índice alfabético ---------- */
  /* A letra (o **A** sozinho num parágrafo, seguido da lista) */
  .markdown-body p:has(> strong:only-child):has(+ ol) {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-size: 1.7em;
    line-height: 1;
    color: var(--tinta);
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.15em;
    margin: 1.4em 0 0.5em;
  }
  .markdown-body p:has(> strong:only-child):has(+ ol) strong { font-weight: 400; }

  /* Os verbetes de cada letra, em colunas */
  .markdown-body p:has(> strong:only-child) + ol {
    list-style: none;
    padding: 0;
    margin: 0 0 0.5em;
    columns: 3 12em;
    column-gap: 2em;
  }
  .markdown-body p:has(> strong:only-child) + ol li {
    break-inside: avoid;
    margin: 0 0 0.25em;
    padding-left: 0;
  }
  .markdown-body p:has(> strong:only-child) + ol li::before { content: none; }

  /* ---------- Página de verbete: acepções numeradas ---------- */
  .markdown-body > ol {
    list-style: none;
    counter-reset: acepcao;
    padding: 0;
  }
  .markdown-body > ol > li {
    counter-increment: acepcao;
    position: relative;
    padding-left: 2em;
    margin: 0 0 0.8em;
  }
  .markdown-body > ol > li::before {
    content: counter(acepcao) ".";
    position: absolute;
    left: 0;
    font-weight: 600;
    color: var(--cinza);
  }

  /* Listas comuns (fontes, colaboradores) */
  .markdown-body ul { padding-left: 1.4em; }
  .markdown-body ul li { margin: 0.2em 0; }
  .markdown-body ul li::marker { color: var(--cinza); }

  /* ---------- Notas e referências ---------- */
  .markdown-body sup a::before { content: "["; }
  .markdown-body sup a::after  { content: "]"; }
  .markdown-body sup { font-size: 0.7em; }

  .markdown-body .footnotes {
    font-size: 0.85em;
    color: var(--cinza);
    margin-top: 3em;
  }
  .markdown-body .footnotes::before {
    content: "Referências";
    display: block;
    font-family: "Libre Caslon Text", Georgia, serif;
    font-size: 1.5em;
    color: var(--tinta);
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.15em;
    margin-bottom: 0.6em;
  }
  .markdown-body .footnotes ol { padding-left: 1.6em; }
  .markdown-body .footnotes hr { display: none; }

  .markdown-body blockquote {
    color: var(--tinta);
    background: #F3EFE4;
    border-left: 3px solid var(--fio);
    padding: 0.6em 1em;
  }
  .markdown-body img { max-width: 100%; border: 1px solid var(--fio); padding: 3px; background: #fff; }

  /* Rodapé do tema */
  .markdown-body .footer {
    border-top: 1px solid var(--fio) !important;
    color: var(--cinza) !important;
    font-size: 0.75em;
  }

  ::selection { background: #DCE6F7; }

  @media (max-width: 600px) {
    .markdown-body { font-size: 17px; padding: 1.5em 1em 2em !important; }
    .markdown-body h1:not(:first-child) { font-size: 1.7em; }
  }
</style>
<!-- ===== fim do estilo ===== -->
