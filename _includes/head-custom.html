<!-- ===== Fedipedia — estilo de enciclopédia clássica. Colar em _includes/head-custom.html ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<style>
  :root {
    --papel: #FBF9F4;
    --tinta: #202122;
    --cinza: #6B6B6B;
    --fio: #D8D3C7;
    --link: #2A5DB0;
    --link-visitado: #5A3E8C;
  }

  html, body { background: var(--papel); }

  .markdown-body {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 18px;
    line-height: 1.65;
    color: var(--tinta);
    max-width: 46em;
    margin: 0 auto !important;
    padding: 2.5em 1.5em 3em !important;
  }

  /* ---------- Cabeçalho: "Fedipedia" como nome de obra de referência ---------- */
  .markdown-body > h1:first-child {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-weight: 400;
    font-size: 1.6em;
    font-variant: small-caps;
    letter-spacing: 0.12em;
    text-align: center;
    border: 0;
    border-bottom: 3px double var(--fio);
    padding: 0 0 0.5em;
    margin: 0 0 1.8em;
  }
  .markdown-body > h1:first-child a { color: var(--tinta); text-decoration: none; }

  /* ---------- Títulos de verbete e seções ---------- */
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-weight: 400;
    color: var(--tinta);
    line-height: 1.25;
  }
  .markdown-body h1:not(:first-child) {
    font-size: 2.1em;
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.2em;
    margin: 1.6em 0 0.7em;
  }
  .markdown-body h2 {
    font-size: 1.45em;
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.15em;
    margin: 1.6em 0 0.6em;
  }
  .markdown-body h3 { font-size: 1.15em; font-weight: 700; border: 0; }

  .markdown-body p { margin: 0 0 1em; }

  /* ---------- Links no padrão de enciclopédia ---------- */
  .markdown-body a { color: var(--link); text-decoration: none; }
  .markdown-body a:visited { color: var(--link-visitado); }
  .markdown-body a:hover { text-decoration: underline; text-underline-offset: 0.15em; }

  /* ---------- Página inicial: índice alfabético em colunas ----------
     A página inteira vira 3 colunas, mas tudo que não é índice ocupa
     a largura toda (column-span). Só as letras e seus verbetes fluem
     de cima para baixo nas colunas, como no índice de uma enciclopédia. */
  .markdown-body {
    counter-reset: verbete;
    columns: 3;
    column-gap: 2.2em;
    column-rule: 1px solid var(--fio);
  }
  .markdown-body > :not(p:has(> strong:only-child):has(+ ol)):not(p:has(> strong:only-child) + ol) {
    column-span: all;
  }

  /* A letra (o **A** sozinho num parágrafo, seguido da lista) */
  .markdown-body p:has(> strong:only-child):has(+ ol) {
    font-family: "Libre Caslon Text", Georgia, serif;
    font-size: 1.4em;
    line-height: 1;
    color: var(--tinta);
    border-bottom: 1px solid var(--fio);
    padding: 0.2em 0 0.15em;
    margin: 0 0 0.3em;
    break-after: avoid;
    break-inside: avoid;
  }
  .markdown-body p:has(> strong:only-child):has(+ ol) strong { font-weight: 400; }

  /* Os verbetes, numerados em sequência ao longo de todo o índice */
  .markdown-body p:has(> strong:only-child) + ol {
    list-style: none;
    padding: 0;
    margin: 0 0 1.2em;
    font-size: 0.92em;
    break-inside: avoid;           /* não parte uma letra entre duas colunas */
  }
  .markdown-body p:has(> strong:only-child) + ol li {
    counter-increment: verbete;
    position: relative;
    padding-left: 2.1em;
    margin: 0 0 0.3em;
    overflow-wrap: anywhere;
  }
  .markdown-body p:has(> strong:only-child) + ol li::before {
    content: counter(verbete);
    position: absolute;
    left: 0;
    top: 0.12em;
    width: 1.6em;
    text-align: right;
    font-size: 0.85em;
    font-weight: 400;
    color: var(--cinza);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Página de verbete (só Markdown, sem cabeçalho YAML) ----------
     # Fediverso
     `Fe·di·ver·so`                  ← separação silábica, entre crases
     *substantivo masculino*         ← tipologia, em itálico, sozinha na linha
     1. Primeira acepção…            ← acepções numeradas
     ## Vide também
     - [Federação](Federação.md)     ← lista de links no fim
  */

  /* Título do verbete seguido de separação silábica: tira o fio do título */
  .markdown-body h1:not(:first-child):has(+ p > code:only-child) {
    border-bottom: 0;
    padding-bottom: 0;
    margin-bottom: 0.15em;
  }

  /* Separação silábica */
  .markdown-body h1 + p:has(> code:only-child) { margin: 0 0 0.1em; }
  .markdown-body h1 + p > code:only-child {
    font-family: inherit;
    font-size: 1.05em;
    letter-spacing: 0.08em;
    color: var(--cinza);
    background: none;
    padding: 0;
    border-radius: 0;
  }

  /* Tipologia (com ou sem a linha da separação silábica antes) */
  .markdown-body h1 + p:has(> code:only-child) + p:has(> em:only-child),
  .markdown-body h1 + p:has(> em:only-child) {
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.7em;
    margin-bottom: 1.5em;
  }

  /* Acepções numeradas (1., 2., 3.…) */
  .markdown-body > ol {
    list-style: none;
    counter-reset: acepcao;
    padding: 0;
  }
  .markdown-body > ol > li {
    counter-increment: acepcao;
    position: relative;
    padding-left: 2em;
    margin: 0 0 0.8em;
  }
  .markdown-body > ol > li::before {
    content: counter(acepcao) ".";
    position: absolute;
    left: 0;
    font-weight: 600;
    color: var(--cinza);
  }

  /* Vide também: a última lista depois de um ## vira uma linha de links com setas */
  .markdown-body h2:has(+ ul:last-of-type) { font-size: 1.3em; margin-top: 2em; }
  .markdown-body h2 + ul:last-of-type {
    list-style: none;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3em 1.6em;
  }
  .markdown-body h2 + ul:last-of-type li { margin: 0; }
  .markdown-body h2 + ul:last-of-type li::before {
    content: "→ ";
    color: var(--cinza);
  }

  /* Listas comuns (fontes, colaboradores) */
  .markdown-body ul { padding-left: 1.4em; }
  .markdown-body ul li { margin: 0.2em 0; }
  .markdown-body ul li::marker { color: var(--cinza); }

  /* ---------- Notas e referências ---------- */
  .markdown-body sup a::before { content: "["; }
  .markdown-body sup a::after  { content: "]"; }
  .markdown-body sup { font-size: 0.7em; }

  .markdown-body .footnotes {
    font-size: 0.85em;
    color: var(--cinza);
    margin-top: 3em;
  }
  .markdown-body .footnotes::before {
    content: "Referências";
    display: block;
    font-family: "Libre Caslon Text", Georgia, serif;
    font-size: 1.5em;
    color: var(--tinta);
    border-bottom: 1px solid var(--fio);
    padding-bottom: 0.15em;
    margin-bottom: 0.6em;
  }
  .markdown-body .footnotes ol { padding-left: 1.6em; }
  .markdown-body .footnotes hr { display: none; }

  .markdown-body blockquote {
    color: var(--tinta);
    background: #F3EFE4;
    border-left: 3px solid var(--fio);
    padding: 0.6em 1em;
  }
  .markdown-body img { max-width: 100%; border: 1px solid var(--fio); padding: 3px; background: #fff; }

  /* Rodapé do tema */
  .markdown-body .footer {
    border-top: 1px solid var(--fio) !important;
    color: var(--cinza) !important;
    font-size: 0.75em;
  }

  ::selection { background: #DCE6F7; }

  @media (max-width: 600px) {
    .markdown-body { font-size: 17px; padding: 1.5em 1em 2em !important; }
    .markdown-body h1:not(:first-child) { font-size: 1.7em; }
    .markdown-body { columns: 2; column-gap: 1.4em; }
  }
</style>
<!-- ===== fim do estilo ===== -->
